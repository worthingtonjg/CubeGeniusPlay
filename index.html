<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Cube Genius</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#17263e}
#unity-container{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#unity-canvas{position:absolute;display:block;transform:none;touch-action:none}
#unity-footer{position:absolute;height:38px;overflow:hidden}
#cube-genius-rotate{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:32px;background:#304667;color:white;text-align:center;font-family:system-ui,sans-serif;touch-action:none}
#cube-genius-rotate[hidden]{display:none!important}
#cube-genius-rotate h1{font-size:clamp(24px,7vw,34px);line-height:1.2;margin:18px 0 12px;max-width:320px}
#cube-genius-rotate p{font-size:17px;line-height:1.5;margin:0;max-width:300px;color:#e4edfa}
#cube-genius-rotate .rotate-symbol{font-size:74px;line-height:1}
</style></head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Cube Genius</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Pages.loader.js";
      var config = {
        matchWebGLToCanvasSize: false,
        arguments: [],
        dataUrl: buildUrl + "/Pages.data",
        frameworkUrl: buildUrl + "/Pages.framework.js",
        codeUrl: buildUrl + "/Pages.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Jonathan Worthington",
        productName: "Cube Genius",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.querySelector('meta[name=viewport]') || document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  window.CubeGeniusPhone.enterFullscreen();
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  <script>(function () {
  'use strict';
  var container=document.getElementById('unity-container'),canvas=document.getElementById('unity-canvas'),footer=document.getElementById('unity-footer');
  var gate=document.createElement('div');gate.id='cube-genius-rotate';gate.hidden=true;
  gate.setAttribute('role','alert');gate.setAttribute('aria-live','polite');
  gate.innerHTML='<div class="rotate-symbol" aria-hidden="true">&#8635;</div><h1>Rotate your phone to play</h1><p>Cube Genius plays in landscape.</p>';
  container.appendChild(gate);
  var hints=navigator.userAgentData;
  var phone=!!(hints&&hints.mobile)||/iPhone|iPod|Windows Phone|Android.*Mobile/i.test(navigator.userAgent);
  // iPhone desktop-site requests can report a Mac platform. Do not gate normal desktops or iPads.
  if(!phone&&navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1&&Math.min(screen.width,screen.height)<=600)phone=true;
  var api=window.CubeGeniusPhone={blocked:false,isPhone:!!phone,enterFullscreen:function(){
    var active=document.fullscreenElement||document.webkitFullscreenElement;
    var fn=active?(document.exitFullscreen||document.webkitExitFullscreen):(container.requestFullscreen||container.webkitRequestFullscreen);
    if(fn){var result=fn.call(active?document:container);if(result&&result.catch)result.catch(function(){});}
  }};
  canvas.width=1280;canvas.height=720;
  function update(){
    var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;
    var blocked=!!phone&&h>w,changed=blocked!==api.blocked;api.blocked=blocked;gate.hidden=!blocked;
    canvas.setAttribute('aria-hidden',blocked?'true':'false');
    var css=window.getComputedStyle(container),left=parseFloat(css.paddingLeft)||0,right=parseFloat(css.paddingRight)||0,top=parseFloat(css.paddingTop)||0,bottom=parseFloat(css.paddingBottom)||0;
    var width=Math.max(1,w-left-right),height=Math.max(1,h-top-bottom-38),scale=Math.min(width/1280,height/720);
    var cw=1280*scale,ch=720*scale;
    canvas.style.width=cw+'px';canvas.style.height=ch+'px';canvas.style.left=(left+(width-cw)/2)+'px';canvas.style.top=(top+(height-ch)/2)+'px';
    footer.style.width=cw+'px';footer.style.left=(left+(width-cw)/2)+'px';footer.style.bottom=bottom+'px';
    if(changed)window.dispatchEvent(new Event('cube-genius-orientation'));
  }
  function blockInput(event){if(api.blocked&&event.key!=='Escape'){event.preventDefault();event.stopImmediatePropagation();}}
  ['pointerdown','pointerup','pointermove','mousedown','mouseup','mousemove','touchstart','touchmove','touchend','wheel','keydown','keyup'].forEach(function(type){window.addEventListener(type,blockInput,{capture:true,passive:false});});
  ['resize','orientationchange','fullscreenchange','webkitfullscreenchange'].forEach(function(type){window.addEventListener(type,update);});
  document.addEventListener('fullscreenchange',update);document.addEventListener('webkitfullscreenchange',update);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',update);
  if(!(container.requestFullscreen||container.webkitRequestFullscreen))document.getElementById('unity-fullscreen-button').style.display='none';
  update();
})();
</script></body>
</html>
